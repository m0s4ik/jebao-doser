name: Release

# Publishes to PyPI when a GitHub release is published (Trusted Publishing: no token stored here).
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build pytest && pip install . && pytest -q
      - name: Check version matches the tag
        run: test "v$(python -c 'import jebao_doser; print(jebao_doser.__version__)')" = "${GITHUB_REF_NAME}"
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
